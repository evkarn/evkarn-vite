<div class="timer-countdown" data-timer-countdown-parent>
	<div class="timer-countdown__header">
		<h2 class="timer-countdown__title">До Нового года осталось</h2>
	</div>

	<div
		class="timer-countdown"
		title="Дата до которой вести отчёт"
		style="display: none"
		data-timer-countdown-finish
	>
		Jan 1 2021 00:00:00
	</div>

	<div class="timer-countdown__main">
		<ul class="timer-countdown__list">
			<li class="timer-countdown__item timer-countdown__days" data-days>
				<div class="timer-countdown__val" data-days-val>00</div>
				<span class="timer-countdown__text" data-days-text>дней</span>
			</li>

			<li class="timer-countdown__separator">:</li>

			<li class="timer-countdown__item timer-countdown__hours" data-hours>
				<div class="timer-countdown__val" data-hours-val>00</div>
				<span class="timer-countdown__text" data-hours-text>часов</span>
			</li>

			<li class="timer-countdown__separator">:</li>

			<li class="timer-countdown__item timer-countdown__minutes" data-minutes>
				<div class="timer-countdown__val" data-minutes-val>00</div>
				<span class="timer-countdown__text" data-minutes-text>минут</span>
			</li>

			<li class="timer-countdown__separator">:</li>

			<li class="timer-countdown__item timer-countdown__seconds" data-seconds>
				<div class="timer-countdown__val" data-seconds-val>00</div>
				<span class="timer-countdown__text" data-seconds-text>секунд</span>
			</li>
		</ul>
	</div>
</div>
