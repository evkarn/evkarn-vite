<fieldset class="header__scheme-switcher scheme-switcher">
	<legend class="scheme-switcher__legend">
		Цветовая схема
	</legend>

	<input
		class="scheme-switcher__radio scheme-switcher__radio--light"
		type="radio"
		name="color-scheme"
		value="light"
		aria-label="Светлая"
	/>
	<input
		class="scheme-switcher__radio scheme-switcher__radio--auto"
		type="radio"
		name="color-scheme"
		value="auto"
		aria-label="Системная"
		checked
	/>
	<input
		class="scheme-switcher__radio scheme-switcher__radio--dark"
		type="radio"
		name="color-scheme"
		value="dark"
		aria-label="Тёмная"
	/>

	<div class="scheme-switcher__status"></div>
</fieldset>
