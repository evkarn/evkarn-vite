<div
	class="spoilers"
	data-spoilers
	data-min="576"
	data-mode="single"
	itemscope
	itemtype="https://schema.org/FAQPage"
>
	<div
		class="spoilers__item"
		data-spoilers-item
		itemscope
		itemprop="mainEntity"
		itemtype="https://schema.org/Question"
	>
		<button
			class="spoilers__trigger"
			data-spoilers-trigger
			aria-expanded="false"
			itemprop="name"
		>
			Заголовок 1
		</button>

		<div
			class="spoilers__content"
			data-spoilers-content
			itemscope
			itemprop="acceptedAnswer"
			itemtype="https://schema.org/Answer"
		>
			<div
				class="spoilers__inner"
				itemprop="text"
			>
				Ответ 1
			</div>
		</div>
	</div>
</div>
