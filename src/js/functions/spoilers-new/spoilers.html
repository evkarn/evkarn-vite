<div
	class="spoilers"
	data-spoilers
	data-min="576"
	data-mode="single"
>
	<div
		class="spoilers__item"
		data-spoilers-item
	>
		<button
			class="spoilers__trigger"
			data-spoilers-trigger
			aria-expanded="false"
		>
			Заголовок 1
		</button>

		<div
			class="spoilers__content"
			data-spoilers-content
		>
			<div class="spoilers__inner">
				<p>Контент спойлера. Отступы теперь на __content, только когда родитель .is-active</p>
			</div>
		</div>
	</div>
</div>
