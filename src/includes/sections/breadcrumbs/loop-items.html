<li
	class="breadcrumbs__item"
	itemprop="itemListElement"
	itemscope
	itemtype="http://schema.org/ListItem"
>
	<a
		class="breadcrumbs__link"
		href="@link"
		itemprop="item"
		aria-current="@current"
	>
		<span itemprop="name">
			@name
		</span>
	</a>

	<meta
		itemprop="position"
		content="@index"
	>
</li>
