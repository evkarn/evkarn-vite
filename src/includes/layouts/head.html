<head
	itemscope
	itemtype="https://schema.org/WPHeader"
>
	<meta charset="utf-8">

	<base href="/">

	<title itemprop="headline">
		@title
	</title>

	<meta
		name="description"
		content="@description"
	>

	<meta
		name="keywords"
		content="@keywords"
	>

	<meta
		http-equiv="X-UA-Compatible"
		content="ie=edge"
	>

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>



	<!-- Template Basic Images Start -->
	<link
		rel="icon"
		type="image/png"
		href="/assets/favicon/favicon-96x96.png"
		sizes="96x96"
	>

	<link
		rel="icon"
		type="image/svg+xml"
		href="/assets/favicon/favicon.svg"
	>

	<link
		rel="shortcut icon"
		href="/assets/favicon/favicon.ico"
	>

	<link
		rel="apple-touch-icon"
		sizes="180x180"
		href="/assets/favicon/apple-touch-icon.png"
	>

	<meta
		name="apple-mobile-web-app-title"
		content="evkarn.ru"
	>

	<link
		rel="manifest"
		href="/assets/favicon/site.webmanifest"
	>
	<!-- /Template Basic Images End -->


	<!--Open Graph-->
	<meta
		property="og:site_name"
		content="@title"
	>

	<meta
		property="og:url"
		content="@siteUrl"
	>

	<meta
		property="og:type"
		content="website"
	>

	<meta
		property="og:title"
		content="@title"
	>

	<meta
		property="og:description"
		content="@description"
	>

	<meta
		property="og:image"
		content="assets/images/og-images/@ogImage.jpg"
	>

	<meta
		property="og:locale"
		content="ru_Ru"
	>

	<meta
		name="twitter:card"
		content="summary_large_image"
	>

	<meta
		name="twitter:title"
		content="@title"
	>

	<meta
		name="twitter:description"
		content="@description"
	>

	<meta
		name="twitter:site"
		content="@siteUrl"
	>

	<meta
		name="twitter:image"
		content="assets/images/og-images/@ogImage.jpg"
	>
	<!--/Open Graph-->


	<!-- Schema-org -->
	<meta
		itemprop="name"
		content="@title"
	>

	<meta
		itemprop="description"
		content="@description"
	>

	<meta
		itemprop="image"
		content="assets/images/og-images/@ogImage.jpg"
	>
	<!-- /Schema-org -->


	<link
		rel="preload"
		href="assets/fonts/Manrope-VariableFont.woff2"
		as="font"
		type="font/woff2"
		crossorigin
	>

	<link
		rel="stylesheet"
		href="/styles/scss/styles.scss"
	>
</head>
